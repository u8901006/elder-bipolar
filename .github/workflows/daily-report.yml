name: OABD Daily Literature Report

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: Load seen PMIDs for dedup
        id: dedup
        run: |
          if [ -f docs/seen_pmids.json ]; then
            echo "has_seen=true" >> "$GITHUB_OUTPUT"
            echo "PMID dedup file found ($(wc -l < docs/seen_pmids.json) lines)"
          else
            echo '{"pmids":[]}' > docs/seen_pmids.json
            echo "has_seen=true" >> "$GITHUB_OUTPUT"
            echo "Created new seen_pmids.json"
          fi

      - name: Fetch papers from PubMed
        env:
          SEEN_PMIDS_PATH: docs/seen_pmids.json
        run: node scripts/fetch_papers.js --days 7 --max-papers 40 --output papers.json
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && node -e "const d=require('./papers.json'); if(!d.count) process.exit(1)"; then
            COUNT=$(node -e "console.log(require('./papers.json').count)")
            NEW=$(node -e "console.log(require('./papers.json').new_count || 0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "new_count=$NEW" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT, new (unsampled): $NEW"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "new_count=0" >> "$GITHUB_OUTPUT"
            node -e "const fs=require('fs'); fs.writeFileSync('papers.json',JSON.stringify({date:'${{ steps.date.outputs.target }}',count:0,new_count:0,papers:[]}))"
            echo "No papers found"
          fi

      - name: Generate report with Zhipu AI
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/generate_report.js --input papers.json --output "docs/oabd-${{ steps.date.outputs.target }}.html"

      - name: Update seen PMIDs
        run: |
          node -e "
            const fs = require('fs');
            const papers = JSON.parse(fs.readFileSync('papers.json','utf8'));
            const seen = JSON.parse(fs.readFileSync('docs/seen_pmids.json','utf8'));
            const seenSet = new Set(seen.pmids);
            for (const p of papers.papers) { if (p.pmid) seenSet.add(p.pmid); }
            const arr = Array.from(seenSet).slice(-2000);
            fs.writeFileSync('docs/seen_pmids.json', JSON.stringify({pmids:arr}));
            console.log('Seen PMIDs updated: ' + arr.length);
          "

      - name: Generate index page
        run: node scripts/generate_index.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "OABD daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        run: |
          echo "### OABD Daily Literature Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers found:** ${{ steps.papers.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**New (unsampled):** ${{ steps.papers.outputs.new_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [oabd-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/elder-bipolar/oabd-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
